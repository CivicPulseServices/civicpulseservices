<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Civic Pulse Services | Security, housekeeping and facility management</title>
<meta name="description" content="Tech-supported security, mechanized housekeeping and facility management for housing societies, malls and commercial complexes.">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#06141a;--panel:#0d2630;--panel2:#12323f;--teal:#19c3b0;--amber:#ffb43b;--bg:#eef5f3;--card:#fff;--tx:#10242b;--mute:#52666d;--line:#d3e0dd;--dtx:#e8f3f1;--dmute:#9fb8b8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1b21;--card:#102a33;--tx:#e8f3f1;--mute:#9fb8b8;--line:#244048}}
:root[data-theme="dark"]{--bg:#0a1b21;--card:#102a33;--tx:#e8f3f1;--mute:#9fb8b8;--line:#244048}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.6 Figtree,system-ui,sans-serif}
h1,h2,h3{font-family:'Bricolage Grotesque',Figtree,sans-serif;margin:0 0 .45em;letter-spacing:-.025em;line-height:1.05}
h1{font-size:clamp(2.4rem,6vw,4.8rem);font-weight:800}
h2{font-size:clamp(1.9rem,4vw,2.9rem);font-weight:800}
h3{font-size:1.2rem;font-weight:700;letter-spacing:-.01em}
p{margin:0 0 1em;max-width:60ch}
a{color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
.wrap{max-width:1180px;margin:0 auto;padding:0 22px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(6,20,26,.88);backdrop-filter:blur(12px);color:var(--dtx);border-bottom:1px solid rgba(255,255,255,.08)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:14px;height:66px}
.logo{display:flex;align-items:center;gap:10px;font:800 1.15rem 'Bricolage Grotesque',sans-serif;text-decoration:none}
.logo svg{width:36px;height:36px}
nav{display:flex;align-items:center;gap:2px}
nav a{padding:8px 13px;border-radius:9px;text-decoration:none;font-size:.95rem;color:var(--dmute);font-weight:500;white-space:nowrap}
nav a:hover,nav a[aria-current="page"]{color:#fff;background:rgba(255,255,255,.08)}
nav a.nb{background:var(--amber);color:#201400;font-weight:700;margin-left:8px}
.btn{display:inline-block;background:var(--amber);color:#201400;font:700 1rem Figtree,sans-serif;padding:15px 26px;border-radius:12px;text-decoration:none;border:0;cursor:pointer;transition:transform .2s ease, box-shadow .2s ease}
.btn:hover{transform:translateY(-2px)}
.btn.ghost{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.4)}
.dark{background:var(--ink);color:var(--dtx);position:relative;overflow:hidden}
.dark p{color:var(--dmute)}
section{padding:80px 0}
.hero{padding:70px 0 110px}
.hero:before{content:"";position:absolute;inset:-20% -10% auto auto;width:700px;height:700px;background:radial-gradient(circle,rgba(25,195,176,.28),transparent 65%)}
.hero .g{display:grid;grid-template-columns:1.05fr .95fr;gap:30px;align-items:center;position:relative}
.hero .lead{font-size:1.1rem;max-width:52ch}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.badge{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.2);border-radius:99px;padding:6px 14px;font-size:.88rem;color:var(--dmute);margin-bottom:22px}
.badge i{width:8px;height:8px;border-radius:50%;background:var(--teal);animation:b 1.4s infinite}
@keyframes b{50%{opacity:.25}}
.scene{position:relative}
.scene>svg{width:100%;height:auto;display:block}
.chip{position:absolute;background:rgba(13,38,48,.92);border:1px solid rgba(25,195,176,.4);color:#fff;border-radius:12px;padding:9px 13px;font-size:.85rem;display:flex;gap:9px;align-items:center;bottom:12%;left:10%}
.chip b{color:var(--teal);font-weight:600}
.chip i{width:9px;height:9px;border-radius:50%;background:#ff5d5d;animation:b 1.2s infinite}
.ecg{position:absolute;left:0;right:0;bottom:0;height:90px;width:100%}
.ecg path{stroke-dasharray:1400;stroke-dashoffset:1400;animation:d 5s ease-out forwards}
@keyframes d{to{stroke-dashoffset:0}}
.marq{background:var(--teal);color:#032421;overflow:hidden;white-space:nowrap;font:700 1.05rem 'Bricolage Grotesque',sans-serif;padding:14px 0}
.marq div{display:inline-block;animation:m 38s linear infinite;padding-left:100%}
.marq span{margin:0 22px}
@keyframes m{to{transform:translateX(-100%)}}
.split{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center;padding:34px 0}
.split.rev .art{order:-1}
.art{border-radius:26px;aspect-ratio:1.15;display:grid;place-items:center;position:relative;overflow:hidden}
.art svg{width:86%;height:auto}
.tag{display:inline-block;font:700 .85rem Figtree;padding:5px 12px;border-radius:99px;margin-bottom:14px}
.pts{list-style:none;padding:0;margin:0 0 24px;display:grid;gap:10px}
.pts li{padding-left:30px;position:relative;color:var(--mute)}
.pts li:before{content:"";position:absolute;left:0;top:7px;width:16px;height:16px;border-radius:5px;background:var(--teal)}
.pts li:after{content:"";position:absolute;left:5px;top:10px;width:5px;height:8px;border:solid #032421;border-width:0 2px 2px 0;transform:rotate(40deg)}
.more{font-weight:700;color:var(--tx);text-decoration:none;border-bottom:3px solid var(--amber)}
.tabs{display:grid;grid-template-columns:260px 1fr;gap:28px;margin-top:34px}
.tl{display:grid;gap:8px;align-content:start}
.tl button{font:600 1rem Figtree;text-align:left;padding:15px 18px;border-radius:14px;border:1px solid rgba(255,255,255,.14);background:transparent;color:var(--dtx);cursor:pointer}
.tl button[aria-selected="true"]{background:var(--teal);color:#032421;border-color:var(--teal)}
.tp{background:var(--panel);border-radius:22px;padding:32px;display:grid;grid-template-columns:1fr 250px;gap:28px;align-items:center;min-height:330px}
.phone{background:#031014;border:2px solid #24505c;border-radius:26px;padding:16px 14px;font-size:.82rem}
.phone .r{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid #16363f}
.phone .r:last-child{border:0}
.phone em{font-style:normal;color:var(--teal)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.stats>div{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px}
.stats b{display:block;font:800 3rem/1 'Bricolage Grotesque',sans-serif;color:var(--teal);margin-bottom:8px}
.stats span{color:var(--mute);font-size:.95rem}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:34px;counter-reset:s}
.steps>div{padding:0 22px 0 0;border-top:3px solid var(--teal);padding-top:20px;counter-increment:s}
.steps>div:before{content:counter(s);display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--amber);color:#201400;font-weight:800;margin:-40px 0 14px;position:relative;z-index:1}
.sect{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:32px}
.sect>div{border-radius:22px;padding:30px;background:var(--panel);color:var(--dtx)}
.sect>div:nth-child(2){background:var(--teal);color:#032421}
.sect>div:nth-child(3){background:var(--amber);color:#201400}
.sect ul{margin:12px 0 0;padding-left:1.1em}
.sect p{color:inherit;opacity:.85}
.grid4{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-top:30px}
.fc{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px}
.fc svg{width:42px;height:42px;margin-bottom:14px}
details{border-bottom:1px solid var(--line);padding:18px 0}
summary{font:700 1.15rem 'Bricolage Grotesque',sans-serif;cursor:pointer}
details p{margin:10px 0 0;color:var(--mute)}
form{display:grid;gap:12px;max-width:560px;margin-top:22px}
label{font-weight:600;font-size:.9rem;display:grid;gap:5px;color:var(--dtx)}
input,select{font:inherit;padding:13px;border-radius:11px;border:1.5px solid #24505c;background:var(--panel);color:#fff;width:100%}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:50px;align-items:start}
.crow{display:flex;gap:14px;align-items:center;margin:14px 0;color:var(--dtx)}
.crow span{width:44px;height:44px;border-radius:12px;background:var(--panel2);display:grid;place-items:center;color:var(--teal);font-weight:800}
footer{background:#030c10;color:var(--dmute);padding:44px 0 50px;font-size:.92rem}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:20px}
footer a{display:block;text-decoration:none;margin:4px 0}
.path{display:inline-block;font:500 .88rem ui-monospace,monospace;border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:4px 10px;color:var(--dmute);margin-bottom:20px}
@media (max-width:860px){.hero .g,.split,.tabs,.tp,.cgrid,.sect,.grid4{grid-template-columns:1fr}.stats,.steps{grid-template-columns:1fr 1fr}.split.rev .art{order:0}section{padding:62px 0}.logo s[...]
@media (prefers-reduced-motion:reduce){*{animation:none!important}.ecg path{stroke-dashoffset:0}html{scroll-behavior:auto}}
</style>
</head>
<body>
<header><div class="wrap bar">
<a class="logo" data-r="" href="/" aria-label="Civic Pulse Services home"><svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="11" fill="#19c3b0"/><path d="M5 22h9l4-11 5 11h10v6H28l-7-18-5 13H5z" fill="#031014"/></svg><span>Civic Pulse</span></a>
<nav aria-label="Main"><a data-r="security" href="/security/">Security</a><a data-r="housekeeping" href="/housekeeping/">Housekeeping</a><a data-r="facility" href="/facility/">Facility</a><a class="nb" href="#contact">Get quote</a></nav>
</div></header>
<main id="app"></main>
<footer><div class="wrap"><div><b style="color:#fff;font-size:1.1rem">Civic Pulse Services</b><br>Security, housekeeping and facility management.<br>© 2026 Civic Pulse Services</div>
<div><a data-r="security" href="/security/">Security Pulse</a><a data-r="housekeeping" href="/housekeeping/">Clean Pulse</a><a data-r="facility" href="/facility/">Facility Pulse</a></div><div>info@civicpulseservices.com<br>+91 00000 00000</div></div></footer>

<script>
const $=s=>document.querySelector(s);
const HASH=!/^\/((security|housekeeping|facility)\/? )?$/.test(location.pathname);
const L=k=>HASH?'#/'+k:(k?'/'+k+'/':'/');
const IC={
sec:'<svg viewBox="0 0 48 48" fill="none" stroke="#19c3b0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M24 5l16 6v12c0 10-7 17-16 20C15 40 8 33 8 23V11z"/><path d="M24 14v9l6 6"/></svg>',
cam:'<svg viewBox="0 0 48 48" fill="none" stroke="#19c3b0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="14" width="28" height="20" rx="5"/><path d="M34 22l9-5v14l-9-5"/></svg>',

gps:'<svg viewBox="0 0 48 48" fill="none" stroke="#19c3b0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M24 44S10 31 10 20a14 14 0 0 1 28 0c0 11-14 24-14 24z"/><circle cx="24" cy="20" r="5"/></svg>',
mach:'<svg viewBox="0 0 48 48" fill="none" stroke="#19c3b0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="14" width="22" height="16" rx="4"/><path d="M30 20h8l3 5v8H8v-8l5-5h17"/></svg>',
eco:'<svg viewBox="0 0 48 48" fill="none" stroke="#19c3b0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M10 38C8 20 20 8 40 8c0 20-10 32-26 30"/><path d="M10 38c8-10 16-14 28-16"/></svg>',
bin:'<svg viewBox="0 0 48 48" fill="none" stroke="#19c3b0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M8 12h32M18 12V7h12v5M12 12l2 30h20l2-30M20 20v14M28 20v14"/></svg>',
wr:'<svg viewBox="0 0 48 48" fill="none" stroke="#19c3b0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M31 9a9 9 0 0 0-11 11L7 33l8 8 13-13A9 9 0 0 0 39 17l-6 6-5-1-1-5-6 6"/></svg>',
wat:'<svg viewBox="0 0 48 48" fill="none" stroke="#19c3b0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M24 5C16 16 11 22 11 29a13 13 0 0 0 26 0c0-7-5-13-13-24z"/><path d="M18 29c2 2 4 3 6 3s4-1 6-3"/></svg>',
lift:'<svg viewBox="0 0 48 48" fill="none" stroke="#19c3b0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="5" width="30" height="38" rx="4"/><path d="M24 5v38M16 19h16M16 29h16"/></svg>',
iot:'<svg viewBox="0 0 48 48" fill="none" stroke="#19c3b0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="24" cy="24" r="5"/><path d="M14 14a14 14 0 0 0 0 20M34 14a14 14 0 0 1 0 20M5 24h7M36 24h7M24 5v7M24 36v7"/></svg>'
};
const S={
security:{n:'Security Pulse',c:'#19c3b0',tag:'Guards who are seen, heard and tracked',intro:'Trained guards for gates, parking and perimeters, backed by a command desk that watches every post in real time.',f:[['cam','Body-worn cameras','Every guard records the shift, so incidents are time-stamped, stored and ready for review.'],['rad','Walkie-talkie network','Posts, patrol supervisors and the control desk stay on one channel for instant response.'],['gps','GPS patrol tracking','Every round is logged against checkpoints to prove coverage.']],pts:['PSARA-licensed, background-verified guards','24/7 CCTV watch and rapid incident dispatch','Parking, valet and event security for malls']},
housekeeping:{n:'Clean Pulse',c:'#ffb43b',tag:'Machines do the heavy cleaning, people do the detail',intro:'Mechanized floor care and eco-friendly housekeeping for lobbies, basements, offices and common areas.',f:[['mach','Ride-on auto-scrubbers','Industrial machines clean large floors faster and more evenly than manual mopping.'],['wr','Advanced equipment','Vacuums, polishers and pressure washers match each surface and workload.'],['eco','Eco-friendly cleaning','Water-saving systems and green products cut waste without cutting standards.']],pts:['Executive housekeeping to corporate standards','High-footfall hygiene for malls and retail parks','Clubhouse, pool and gym upkeep']},
facility:{n:'Facility Pulse',c:'#7fd1ff',tag:'The systems behind the building keep running',intro:'Engineering and technical maintenance that keeps power, water, lifts and fire safety reliable.',f:[['wr','MEP maintenance','DG sets, electrical panels, hydro-pneumatic pumps and HVAC care.'],['wat','STP and WTP operations','Certified operators for sewage treatment and water filtration plant reliability.'],['lift','Lift and fire-system AMC','Preventive maintenance keeps vertical transport and safety systems stable.']],pts:['Zero-downtime AMC coordination','Audit-ready safety compliance tracking','Escalator and HVAC reliability for malls']}
};
const ART={
security:'<svg viewBox="0 0 300 260"><circle cx="150" cy="130" r="108" fill="#0d2630"/><path d="M150 36l70 26v54c0 48-30 80-70 94-40-14-70-46-70-94V62z" fill="#19c3b0"/><path d="M150 60l50 18v40c0 30-20 50-50 64-30-14-50-34-50-64V78z" fill="#0a1b21" opacity=".35"/><path d="M118 130h64v45h-64z" fill="#e8f3f1"/></svg>',
housekeeping:'<svg viewBox="0 0 300 260"><circle cx="150" cy="130" r="108" fill="#4a3410"/><rect x="60" y="120" width="150" height="62" rx="16" fill="#ffb43b"/><rect x="78" y="92" width="70" height="42" rx="11" fill="#0d2630"/><circle cx="208" cy="172" r="22" fill="#0d2630"/><path d="M118 88h32v56h-32z" fill="#fff" opacity=".25"/></svg>',
facility:'<svg viewBox="0 0 300 260"><circle cx="150" cy="130" r="108" fill="#0f3347"/><circle cx="150" cy="130" r="64" fill="none" stroke="#7fd1ff" stroke-width="12" stroke-dasharray="300 100"/><path d="M150 70v120M90 130h120M106 96l88 68M194 96l-88 68" fill="none" stroke="#e8f3f1" stroke-width="8" stroke-linecap="round"/></svg>'
};
const TECH=[
['Body-worn cameras','Every guard wears a camera for recording. Footage is time-stamped and stored, so disputes and incidents are settled with evidence.',[['Gate 2','<em>Recording</em>'],['Lobby desk','<em>Saved</em>'],['Night patrol','<em>Synced</em>']]],
['Walkie-talkie desk','A single radio network connects every post, supervisor and the control desk, with an instant channel for emergencies.',[['Control desk','<em>Online</em>'],['Supervisor','<em>Ready</em>'],['Gate 3','<em>Live</em>']]],
['GPS patrol tracking','Guards are tracked live and scan QR checkpoints on each round, so every patrol is logged and verified.',[['Checkpoint 1','<em>10:02</em>'],['Checkpoint 2','<em>10:11</em>'],['Checkpoint 3','<em>10:22</em>']]],
['Resident and client app','Residents pre-approve visitors, pay bills, book amenities and raise complaints. Every ticket is tracked to closure.',[['Visitor pass','<em>Approved</em>'],['Maintenance','<em>Booked</em>'],['Complaint','<em>Open</em>']]]

const FAQ=[['Which properties do you serve?','Housing societies, malls and retail parks, and commercial or IT parks.'],['Do I need three separate vendors?','No. Security, housekeeping and facility management can be managed under one accountable partner.'],['How fast can you begin?','After a site visit and scope discussion, most properties are mobilized in 2–4 weeks.']];
const quote=p=>`<form onsubmit="return send(event)"><label>Your name<input name="n" required autocomplete="name"></label><label>Property type<select name="t"><option>Housing society</option><option>Mall</option><option>IT park</option><option>Commercial building</option></select></label><label>Email<input name="e" type="email" required autocomplete="email"></label><label>Requirements<textarea name="m" rows="4" required></textarea></label><button class="btn" type="submit">Send request</button></form>`;
function send(e){e.preventDefault();const f=new FormData(e.target);location.href='mailto:info@civicpulseservices.com?subject='+encodeURIComponent('Quote request')+'&body='+encodeURIComponent(`Name: ${f.get('n')}\nProperty type: ${f.get('t')}\nEmail: ${f.get('e')}\n\nRequirements:\n${f.get('m')}`)}
const contact=p=>`<section id="contact" class="dark"><div class="wrap cgrid"><div><h2>Let's secure and run your property</h2><p>Tell us about your site. We will arrange a visit and send a quote.</p><div class="crow"><span>1</span><div><b>Share your site</b><br><small>Tell us what you need.</small></div></div><div class="crow"><span>2</span><div><b>Get a survey</b><br><small>We review staffing, assets and service timing.</small></div></div><div class="crow"><span>3</span><div><b>Start service</b><br><small>We roll out trained teams and dashboards.</small></div></div></div><div>${quote(p)}</div></div></section>`;

function home(){return `

<span class="badge"><i></i>Tech-supported facility management</span>
<h1>Every gate guarded. Every floor cared for. Every system running.</h1>
<p class="lead">Civic Pulse Services runs security, housekeeping and facility management for housing societies, malls and commercial complexes, with technology that shows the work as it happens.</p>
<div class="cta"><a class="btn" href="#contact">Get a free site survey</a><a class="btn ghost" href="#services">Explore services</a></div></div>
<div class="scene"><svg viewBox="0 0 420 440" role="img" aria-label="Illustration of a protected building with a patrol route"><defs><linearGradient id="gb" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1a8d89"/><stop offset="100%" stop-color="#0d2630"/></linearGradient></defs><rect x="30" y="150" width="120" height="250" rx="8" fill="url(#gb)"/><rect x="160" y="60" width="130" height="340" rx="8" fill="url(#gb)"/><rect x="300" y="190" width="95" height="210" rx="8" fill="#0f2d39"/><rect x="42" y="166" width="96" height="18" fill="#c9f4ef" opacity=".8"/><rect x="172" y="76" width="104" height="18" fill="#c9f4ef" opacity=".8"/><rect x="315" y="206" width="62" height="18" fill="#c9f4ef" opacity=".8"/><circle cx="301" cy="72" r="34" fill="#ffb43b" opacity=".26"/><circle cx="70" cy="94" r="24" fill="#19c3b0" opacity=".2"/><path d="M0 430H420" stroke="#1d4150" stroke-width="4"/><circle cx="225" cy="40" r="10" fill="#19c3b0"/><circle cx="225" cy="40" r="22" fill="#19c3b0" opacity=".25"/><circle cx="225" cy="40" r="36" fill="#19c3b0" opacity=".12"/></svg>
<div class="chip" style="top:6%;left:0"><i></i><span>Body cam <b>recording</b></span></div>
<div class="chip" style="top:42%;right:0"><span>GPS patrol <b>4 of 6 checkpoints</b></span></div>
<div class="chip" style="bottom:14%;left:4%"><span>Auto-scrubber P1 <b>82% done</b></span></div></div></div>${ecg()}</div>
<div class="marq" aria-hidden="true"><div>${['Body cams','Walkie-talkie desk','GPS patrol tracking','Auto-scrubbers','STP and WTP','Lift AMC','Resident app','IoT alerts','PSARA licensed','Eco-friendly process'].map(v=>`<span>${v}</span>`).join('')}</div></div>
<section id="services"><div class="wrap"><h2>Three services, one accountable partner</h2><p style="color:var(--mute);font-size:1.05rem">No vendor blame games. Security, cleaning and maintenance under one team with a single point of accountability.</p>
${Object.entries(S).map(([k,v],i)=>`<div class="split ${i%2?'rev':''}"><div><span class="tag" style="background:${v.c};color:#06141a">${v.n}</span><h3 style="font-size:2rem">${v.tag}</h3><p style="color:var(--mute)">${v.intro}</p><ul class="pts">${v.pts.map(p=>`<li>${p}</li>`).join('')}</ul><a class="more" href="${L(k)}">Learn more</a></div><div class="art">${ART[k]}</div></div>`).join('')}</div></section>
<section class="dark" id="tech"><div class="wrap"><h2>Technology you can see working</h2><p>Tap through the tools that sit behind every shift.</p>
<div class="tabs"><div class="tl" role="tablist">${TECH.map((t,i)=>`<button role="tab" aria-selected="${i==0}" data-i="${i}">${t[0]}</button>`).join('')}</div><div class="tp" id="tp" role="tabpanel"></div></div></div></section>
<section><div class="wrap"><div class="stats"><div><b data-n="15" data-p="&lt; ">0</b><span>minute average emergency response</span></div><div><b data-n="100" data-s="%">0</b><span>digital ticket closure</span></div><div><b data-n="24" data-s="/7">0</b><span>desk watch and escalation</span></div><div><b data-n="25" data-s="%">0</b><span>operating cost savings</span></div></div></div></section>
<section style="padding-top:20px"><div class="wrap"><h2>From first visit to full control</h2><p style="color:var(--mute)">A simple path to getting your property managed.</p><div class="steps"><div><h3>1. Site walk</h3><p>We inspect gates, common areas, machines and safety points.</p></div><div><h3>2. Scope</h3><p>We agree staffing, schedules and service KPIs.</p></div><div><h3>3. Mobilize</h3><p>Supervisors, guards and cleaning teams are assigned.</p></div><div><h3>4. Monitor</h3><p>We track activity, tickets and response with live visibility.</p></div></div></div></section>
<section class="dark"><div class="wrap"><h2>Built for the places people live, shop and work</h2><div class="sect"><div><h3>Housing societies</h3><p>Safe gates and clean common areas.</p><ul><li>Automated dues collection</li><li>Visitor and delivery gating</li><li>Clubhouse, pool and gym care</li></ul></div><div><h3>Malls and retail parks</h3><p>High footfall, handled calmly.</p><ul><li>High-footfall floor care</li><li>Valet and event security</li><li>Escalator and HVAC uptime</li></ul></div><div><h3>Commercial and IT parks</h3><p>Corporate standards, every day.</p><ul><li>Executive housekeeping</li><li>Badge and turnstile integration</li><li>Safety audit readiness</li></ul></div></div></div></section>
<section><div class="wrap" style="max-width:820px"><h2>Questions we hear often</h2>${FAQ.map(q=>`<details><summary>${q[0]}</summary><p>${q[1]}</p></details>`).join('')}</div></section>${contact('home')}`}
function svc(k){const v=S[k];return `<div class="dark hero" style="padding-bottom:110px"><div class="wrap g"><div><span class="path">civicpulseservices.com/${k}</span><h1>${v.n}</h1><p class="lead">${v.intro}</p><div class="cta"><a class="btn" href="#contact">Request a site visit</a><a class="btn ghost" href="/">Back home</a></div></div><div class="scene"><div class="art" style="aspect-ratio:1.15;border-radius:28px;">${ART[k]}</div></div></div>${ecg()}</div><section><div class="wrap"><h2>What you get</h2><div class="grid4">${v.f.map(f=>`<div class="fc">${IC[f[0]]}<h3>${f[1]}</h3><p style="color:var(--mute);margin:0">${f[2]}</p></div>`).join('')}</div><h3 style="margin-top:56px">Also included</h3><ul class="pts" style="margin-top:14px">${v.pts.map(p=>`<li>${p}</li>`).join('')}</ul></div></section>${contact(k)}`}
function tab(i){const t=TECH[i];$('#tp').innerHTML=`<div><h3 style="font-size:1.7rem">${t[0]}</h3><p style="font-size:1rem">${t[1]}</p></div><div class="phone">${t[2].map(r=>`<div class="r"><span>${r[0]}</span><span>${r[1]}</span></div>`).join('')}</div>`}
function route(){const h=HASH?location.hash.replace(/^#\/?/, ''):location.pathname.replace(/\/+$/,'').replace(/^\//,'');const k=S[h]?h:'';$('#app').innerHTML=k?svc(k):home();document.title=(k?S[k].n+' | ':'')+'Civic Pulse Services';document.querySelectorAll('[data-r]').forEach(a=>{const r=a.dataset.r;a.href=L(r);if(r===k)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});if(!k){document.querySelectorAll('.tl button').forEach(b=>b.onclick=()=>tab(+b.dataset.i));tab(0)};const c=location.hash==='#contact';if(c)setTimeout(()=>$('#contact')&&$('#contact').scrollIntoView(),0);else window.scrollTo(0,0)}
addEventListener('hashchange',()=>route());route();
</script>
</body>
</html>
