<style>

box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1b21;--card:#102a33;--tx:#e8f3f1;--mute:#9fb8b8;--line:#244048}}
:root[data-theme="dark"]{--bg:#0a1b21;--card:#102a33;--tx:#e8f3f1;--mute:#9fb8b8;--line:#244048}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:400 17px/1.6 Figtree,system-ui,sans-serif}
h1,h2,h3{font-family:'Bricolage Grotesque',Figtree,sans-serif;margin:0 0 .45em;letter-spacing:-.025em;line-height:1.05}
h1{font-size:clamp(2.6rem,7.4vw,5.4rem);font-weight:800}
h2{font-size:clamp(2rem,4.8vw,3.3rem);font-weight:800}
h3{font-size:1.3rem;font-weight:700;letter-spacing:-.01em}
p{margin:0 0 1em;max-width:60ch}
a{color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
.wrap{max-width:1180px;margin:0 auto;padding:0 22px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(6,20,26,.88);backdrop-filter:blur(12px);color:var(--dtx);border-bottom:1px solid rgba(255,255,255,.08)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:14px;height:66px}
.logo{display:flex;align-items:center;gap:10px;font:800 1.15rem 'Bricolage Grotesque',sans-serif;text-decoration:none}
.logo svg{width:36px;height:36px}
nav{display:flex;align-items:center;gap:2px}
nav a{padding:8px 13px;border-radius:9px;text-decoration:none;font-size:.95rem;color:var(--dmute);font-weight:500;white-space:nowrap}
nav a:hover,nav a[aria-current="page"]{color:#fff;background:rgba(255,255,255,.08)}
nav a.nb{background:var(--amber);color:#201400;font-weight:700;margin-left:8px}
.btn{display:inline-block;background:var(--amber);color:#201400;font:700 1rem Figtree,sans-serif;padding:15px 26px;border-radius:12px;text-decoration:none;border:0;cursor:pointer;transition:transform .15s}
.btn:hover{transform:translateY(-2px)}
.btn.ghost{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.4)}
.dark{background:var(--ink);color:var(--dtx);position:relative;overflow:hidden}
.dark p{color:var(--dmute)}
section{padding:92px 0}
.hero{padding:70px 0 120px}
.hero:before{content:"";position:absolute;inset:-20% -10% auto auto;width:700px;height:700px;background:radial-gradient(circle,rgba(25,195,176,.28),transparent 65%)}
.hero .g{display:grid;grid-template-columns:1.05fr .95fr;gap:30px;align-items:center;position:relative}
.hero .lead{font-size:1.2rem;max-width:52ch}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.badge{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.2);border-radius:99px;padding:6px 14px;font-size:.88rem;color:var(--dmute);margin-bottom:22px}
.badge i{width:8px;height:8px;border-radius:50%;background:var(--teal);animation:b 1.4s infinite}
@keyframes b{50%{opacity:.25}}
.scene{position:relative}
.scene>svg{width:100%;height:auto;display:block}
.chip{position:absolute;background:rgba(13,38,48,.92);border:1px solid rgba(25,195,176,.4);color:#fff;border-radius:12px;padding:9px 13px;font-size:.85rem;display:flex;gap:9px;align-items:center;box-shadow:0 14px 30px -12px #000}
.chip b{color:var(--teal);font-weight:600}
.chip i{width:9px;height:9px;border-radius:50%;background:#ff5d5d;animation:b 1.2s infinite}
.ecg{position:absolute;left:0;right:0;bottom:0;height:90px;width:100%}
.ecg path{stroke-dasharray:1400;stroke-dashoffset:1400;animation:d 5s ease-out forwards}
@keyframes d{to{stroke-dashoffset:0}}
.marq{background:var(--teal);color:#032421;overflow:hidden;white-space:nowrap;font:700 1.05rem 'Bricolage Grotesque',sans-serif;padding:14px 0}
.marq div{display:inline-block;animation:m 38s linear infinite;padding-left:100%}
.marq span{margin:0 22px}
@keyframes m{to{transform:translateX(-100%)}}
.split{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center;padding:34px 0}
.split.rev .art{order:-1}
.art{border-radius:26px;aspect-ratio:1.15;display:grid;place-items:center;position:relative;overflow:hidden}
.art svg{width:86%;height:auto}
.tag{display:inline-block;font:700 .85rem Figtree;padding:5px 12px;border-radius:99px;margin-bottom:14px}
.pts{list-style:none;padding:0;margin:0 0 24px;display:grid;gap:10px}
.pts li{padding-left:30px;position:relative;color:var(--mute)}
.pts li:before{content:"";position:absolute;left:0;top:7px;width:16px;height:16px;border-radius:5px;background:var(--teal)}
.pts li:after{content:"";position:absolute;left:5px;top:10px;width:5px;height:8px;border:solid #032421;border-width:0 2px 2px 0;transform:rotate(40deg)}
.more{font-weight:700;color:var(--tx);text-decoration:none;border-bottom:3px solid var(--amber)}
.tabs{display:grid;grid-template-columns:260px 1fr;gap:28px;margin-top:34px}
.tl{display:grid;gap:8px;align-content:start}
.tl button{font:600 1rem Figtree;text-align:left;padding:15px 18px;border-radius:14px;border:1px solid rgba(255,255,255,.14);background:transparent;color:var(--dtx);cursor:pointer}
.tl button[aria-selected="true"]{background:var(--teal);color:#032421;border-color:var(--teal)}
.tp{background:var(--panel);border-radius:22px;padding:32px;display:grid;grid-template-columns:1fr 250px;gap:28px;align-items:center;min-height:330px}
.phone{background:#031014;border:2px solid #24505c;border-radius:26px;padding:16px 14px;font-size:.82rem}
.phone .r{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid #16363f}
.phone .r:last-child{border:0}
.phone em{font-style:normal;color:var(--teal)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.stats>div{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px}
.stats b{display:block;font:800 3rem/1 'Bricolage Grotesque',sans-serif;color:var(--teal);margin-bottom:8px}
.stats span{color:var(--mute);font-size:.95rem}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:34px;counter-reset:s}
.steps>div{padding:0 22px 0 0;border-top:3px solid var(--teal);padding-top:20px;counter-increment:s}
.steps>div:before{content:counter(s);display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--amber);color:#201400;font-weight:800;margin:-40px 0 14px;position:relative}
.sect{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:32px}
.sect>div{border-radius:22px;padding:30px;background:var(--panel);color:var(--dtx)}
.sect>div:nth-child(2){background:var(--teal);color:#032421}
.sect>div:nth-child(3){background:var(--amber);color:#201400}
.sect ul{margin:12px 0 0;padding-left:1.1em}
.sect p{color:inherit;opacity:.85}
.grid4{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-top:30px}
.fc{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px}
.fc svg{width:42px;height:42px;margin-bottom:14px}
details{border-bottom:1px solid var(--line);padding:18px 0}
summary{font:700 1.15rem 'Bricolage Grotesque',sans-serif;cursor:pointer}
details p{margin:10px 0 0;color:var(--mute)}
form{display:grid;gap:12px;max-width:560px;margin-top:22px}
label{font-weight:600;font-size:.9rem;display:grid;gap:5px;color:var(--dtx)}
input,select{font:inherit;padding:13px;border-radius:11px;border:1.5px solid #24505c;background:var(--panel);color:#fff;width:100%}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:50px;align-items:start}
.crow{display:flex;gap:14px;align-items:center;margin:14px 0;color:var(--dtx)}
.crow span{width:44px;height:44px;border-radius:12px;background:var(--panel2);display:grid;place-items:center;color:var(--teal);font-weight:800}
footer{background:#030c10;color:var(--dmute);padding:44px 0 50px;font-size:.92rem}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:20px}
footer a{display:block;text-decoration:none;margin:4px 0}
.path{display:inline-block;font:500 .88rem ui-monospace,monospace;border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:4px 10px;color:var(--dmute);margin-bottom:20px}
@media (max-width:860px){.hero .g,.split,.tabs,.tp,.cgrid,.sect,.grid4{grid-template-columns:1fr}.stats,.steps{grid-template-columns:1fr 1fr}.split.rev .art{order:0}section{padding:62px 0}.logo span{display:none}nav a:not(.nb){display:none}.chip{font-size:.75rem;padding:7px 10px}.steps>div{margin-bottom:30px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.ecg path{stroke-dashoffset:0}html{scroll-behavior:auto}}
</style>
</head>

<section id="services"><div class="wrap"><h2>Three services, one accountable partner</h2><p style="color:var(--mute);font-size:1.1rem">No vendor blame games. Security, cleaning and maintenance under one roof, with a single key account manager.</p>
${Object.entries(S).map(([k,v],i)=>`<div class="split ${i%2?'rev':''}"><div><span class="tag" style="background:${v.c};color:#06141a">${v.n}</span><h3 style="font-size:2rem">${v.tag}</h3><p style="color:var(--mute)">${v.intro}</p><ul class="pts">${v.pts.map(p=>`<li>${p}</li>`).join('')}</ul><a class="more" href="${L(k)}">See ${v.n}</a></div><div class="art" style="background:#0d2630">${ART[k]}</div></div>`).join('')}</div></section>

<section style="padding-top:20px"><div class="wrap"><h2>From first visit to full control</h2><p style="color:var(--mute)">A simple path to getting your property managed.</p><div class="steps"><div><h3>Site survey</h3><p style="color:var(--mute)">We walk the property and map risks, areas and systems.</p></div><div><h3>Custom plan</h3><p style="color:var(--mute)">You get a staffing, equipment and cost proposal.</p></div><div><h3>Deploy</h3><p style="color:var(--mute)">Trained teams, body cams, radios and machines go live.</p></div><div><h3>Monitor</h3><p style="color:var(--mute)">Our central desk tracks, reports and improves every month.</p></div></div></div></section>

<section><div class="wrap" style="max-width:820px"><h2>Questions we hear often</h2>${FAQ.map(q=>`<details><summary>${q[0]}</summary><p>${q[1]}</p></details>`).join('')}</div></section>${contact('')}`}
function svc(k){const v=S[k];return `<div class="dark hero" style="padding-bottom:110px"><div class="wrap g"><div><span class="path">civicpulseservices.com/${k}</span><h1>${v.n}</h1><p class="lead" style="color:#fff;font-size:1.5rem;font-family:'Bricolage Grotesque';font-weight:700;line-height:1.2">${v.tag}</p><p class="lead">${v.intro}</p><div class="cta"><a class="btn" href="#contact">Request a quote</a><a class="btn ghost" href="${L('')}">All services</a></div></div><div class="art" style="background:#0d2630">${ART[k]}</div></div>${ecg()}</div>
<section><div class="wrap"><h2>What you get</h2><div class="grid4">${v.f.map(f=>`<div class="fc">${IC[f[0]]}<h3>${f[1]}</h3><p style="color:var(--mute);margin:0">${f[2]}</p></div>`).join('')}</div>
<h3 style="margin-top:56px">Also included</h3><ul class="pts" style="margin-top:14px">${v.pts.map(p=>`<li>${p}</li>`).join('')}</ul></div></section>${contact(k)}`}
function tab(i){const t=TECH[i];$('#tp').innerHTML=`<div><h3 style="font-size:1.9rem">${t[0]}</h3><p style="font-size:1.05rem">${t[1]}</p></div><div class="phone">${t[2].map(r=>`<div class="r"><span>${r[0]}</span><span>${r[1]}</span></div>`).join('')}</div>`;document.querySelectorAll('.tl button').forEach(b=>b.setAttribute('aria-selected',b.dataset.i==i))}
function route(){const h=HASH?location.hash.replace(/^#\/?/,''):location.pathname.replace(/\//g,'');const k=S[h]?h:'';
$('#app').innerHTML=k?svc(k):home();document.title=(k?S[k].n+' | ':'')+'Civic Pulse Services';
document.querySelectorAll('[data-r]').forEach(a=>{const r=a.dataset.r;a.href=L(r);r==k&&r?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current')});
if(!k){document.querySelectorAll('.tl button').forEach(b=>b.onclick=()=>tab(+b.dataset.i));tab(0);
const w=$('#win');if(w){let s='';for(let x=44;x<140;x+=26)for(let y=170;y<380;y+=30)s+=`<rect x="${x}" y="${y}" width="12" height="16" rx="2" opacity="${Math.random()>.45?1:.18}"/>`;for(let x=176;x<280;x+=28)for(let y=80;y<380;y+=30)s+=`<rect x="${x}" y="${y}" width="12" height="16" rx="2" opacity="${Math.random()>.45?1:.18}"/>`;for(let x=314;x<384;x+=26)for(let y=210;y<380;y+=30)s+=`<rect x="${x}" y="${y}" width="12" height="16" rx="2" opacity="${Math.random()>.45?1:.18}"/>`;w.innerHTML=s}
const io=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;io.unobserve(e.target);const el=e.target,n=+el.dataset.n,p=el.dataset.p||'',s=el.dataset.s||'';let t0;const st=ts=>{t0=t0||ts;const r=Math.min((ts-t0)/1200,1);el.innerHTML=p+Math.round(n*r)+s;if(r<1)requestAnimationFrame(st)};requestAnimationFrame(st)}),{threshold:.6});document.querySelectorAll('[data-n]').forEach(el=>io.observe(el))}
const c=location.hash==='#contact';if(c)setTimeout(()=>$('#contact')&&$('#contact').scrollIntoView(),0);else window.scrollTo(0,0)}
addEventListener('hashchange',()=>{if(location.hash!=='#contact')route()});route();
</script>
